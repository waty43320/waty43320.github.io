<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            transition: 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #f0f4f8;
        }
        .name {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .desc {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .links a {
            display: inline-block;
            padding: 10px 22px;
            background: #f0f4f8;
            color: #222;
            text-decoration: none;
            border-radius: 30px;
            font-size: 15px;
            transition: 0.3s;
        }
        .links a:hover {
            background: #2563eb;
            color: #fff;
        }
        footer {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 替换成你的头像链接 -->

        <div class="name">Waty's House</div>
        <div class="desc">热爱生活｜持续学习｜记录成长<br/>欢迎来到我的个人主页</div>

        <div class="links">
    <!-- 把引号内换成你的博客地址 -->

    <!-- 换成你的GitHub主页地址 -->

    <!-- 联系我可以放邮箱、社交账号链接 -->
    <a href="24984003@qq.com" target="_blank">联系我</a>
</div>
    </div>
    <footer>© 2026 Waty's House All Rights Reserved</footer>
</body>
</html>
