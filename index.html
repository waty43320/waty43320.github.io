<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waty's House | 设计师作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, 思源黑体, sans-serif;
            /* 设计师高级灰底色，极简质感 */
            background-color: #0f1117;
            color: #e5e7eb;
            min-height: 100vh;
            padding: 60px 20px;
        }

        /* 整体容器，居中自适应 */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 个人头部卡片 */
        .profile-card {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 24px;
            border: 3px solid #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
            transition: all 0.4s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.4);
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .job {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .desc {
            color: #d1d5db;
            font-size: 15px;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto;
        }

        /* 社交链接模块 */
        .social-links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin: 40px 0 60px;
        }

        .social-links a {
            padding: 12px 28px;
            border: 1px solid #374151;
            border-radius: 40px;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            background: transparent;
        }

        .social-links a:hover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            transform: translateY(-3px);
        }

        /* 作品展示板块 */
        .work-title {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 30px;
            padding-left: 12px;
            border-left: 4px solid #3b82f6;
        }

        .work-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 80px;
        }

        .work-card {
            background: #1f2937;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            border: 1px solid #374151;
        }

        .work-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            border-color: #3b82f6;
        }

        .work-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .work-info {
            padding: 20px;
        }

        .work-name {
            font-size: 16px;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .work-desc {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.6;
        }

        /* 底部版权 */
        footer {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        /* 入场动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .name {
                font-size: 26px;
            }
            .work-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 个人信息头部 -->
        <div class="profile-card">
            <img class="avatar" src="https://s2.loli.net/2024/03/11/9XZ7kYqg3fS1dLR.png" alt="头像">
            <div class="name">Waty's House</div>
            <div class="job">视觉设计师 / 创意创作者</div>
            <div class="desc">欢迎来到我的个人主页｜专注视觉设计、创意美学，用作品表达设计态度</div>

            <!-- 已配置好你的专属链接 -->
            <div class="social-links">
                <a href="https://weibo.com/waty43320" target="_blank">微博</a>
                <a href="https://github.com/waty43320" target="_blank">GitHub</a>
                <a href="mailto:24984003@qq.com" target="_blank">联系我</a>
                <a href="#" target="_blank">更多作品</a>
            </div>
        </div>

        <!-- 设计师作品展示区（核心板块） -->
        <h2 class="work-title">精选作品</h2>
        <div class="work-grid">
            <!-- 作品卡片1，可自行替换图片和文案 -->
            <div class="work-card">
                <img class="work-img" src="https://picsum.photos/600/400?random=1" alt="设计作品">
                <div class="work-info">
                    <div class="work-name">视觉海报设计</div>
                    <div class="work-desc">极简风商业海报视觉创作，侧重色彩搭配与版式构图</div>
                </div>
            </div>

            <!-- 作品卡片2 -->
            <div class="work-card">
                <img class="work-img" src="https://picsum.photos/600/400?random=2" alt="设计作品">
                <div class="work-info">
                    <div class="work-name">UI界面设计</div>
                    <div class="work-desc">移动端界面视觉设计，注重交互体验与视觉统一性</div>
                </div>
            </div>

            <!-- 作品卡片3 -->
            <div class="work-card">
                <img class="work-img" src="https://picsum.photos/600/400?random=3" alt="设计作品">
                <div class="work-info">
                    <div class="work-name">品牌视觉设计</div>
                    <div class="work-desc">小众品牌视觉VI设计，打造专属品牌视觉体系</div>
                </div>
            </div>
        </div>

        <!-- 底部版权 -->
        <footer>© 2026 Waty's House | 设计师个人作品集 All Rights Reserved</footer>
    </div>
</body>
</html>
